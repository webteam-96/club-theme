<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- THE LOGO FRAME, cut as a 9-slice tile for CSS border-image.
       26px corner blocks are never scaled, so the corner motif keeps its shape
       at any logo size; the 12px middle bands repeat along the edges, which is
       what lets one file fit a wide masthead mark and a tall footer one.

       THIRD CUT, 2026-09-10. Rendered at 420px and looked at, which is the only
       way to judge 26px artwork:
         · cut 1 dashed the inner rule the whole way round - at masthead size
           that is a grey dotted rectangle, not a frame.
         · cut 2 put a ring ON the chamfer, so the diagonal ran straight THROUGH
           each ring. It read as a mistake, not an ornament.
       This one is a BEAD ON A RULE, the classical form: the outer rule runs to
       the corner, stops, a ring sits in the gap, and the rule resumes. Nothing
       overlaps anything.
       The dashed accent runs are gone too - at 0.1/3.6 they rendered as nothing
       at all, and they were clutter at any width that did show them.

       Everything is stroked, nothing filled: this frame sits on white in both
       places it is used, and must not carry a ground of its own. -->
  <g fill="none" stroke="#D08B12" stroke-linecap="round" stroke-linejoin="round">

    <!-- ── OUTER RULE. Straight runs, then a short chamfer stub that stops at
           the bead's edge. Stub ends are computed on the (0,13)->(13,0)
           diagonal at 4.7 from each end, so the gap to the r=4.5 ring is even
           on both sides. ─────────────────────────────────────────────────── -->
    <g stroke-width="1.9">
      <path d="M0 26 V13 L3.3 9.7"/>   <path d="M9.7 3.3 L13 0 H26"/>
      <path d="M38 0 H51 L54.3 3.3"/>  <path d="M60.7 9.7 L64 13 V26"/>
      <path d="M64 38 V51 L60.7 54.3"/><path d="M54.3 60.7 L51 64 H38"/>
      <path d="M26 64 H13 L9.7 60.7"/> <path d="M3.3 54.3 L0 51 V38"/>
      <!-- the repeating middle bands -->
      <path d="M26 0 H38"/>  <path d="M64 26 V38"/>
      <path d="M26 64 H38"/> <path d="M0 26 V38"/>
    </g>

    <!-- ── THE BEAD, in the gap the rule leaves for it ───────────────────── -->
    <g stroke-width="1.6">
      <circle cx="6.5"  cy="6.5"  r="4.5"/>
      <circle cx="57.5" cy="6.5"  r="4.5"/>
      <circle cx="57.5" cy="57.5" r="4.5"/>
      <circle cx="6.5"  cy="57.5" r="4.5"/>
    </g>

    <!-- ── INNER RULE, inset 6, chamfered 11. Its corner clears the bead by
           2.5px, so the two never touch. ──────────────────────────────────── -->
    <g stroke-width="1.05" opacity=".9">
      <path d="M6 26 V17 L17 6 H26"/>
      <path d="M38 6 H47 L58 17 V26"/>
      <path d="M58 38 V47 L47 58 H38"/>
      <path d="M26 58 H17 L6 47 V38"/>
      <path d="M26 6 H38"/>  <path d="M58 26 V38"/>
      <path d="M26 58 H38"/> <path d="M6 26 V38"/>
    </g>
  </g>
</svg>
